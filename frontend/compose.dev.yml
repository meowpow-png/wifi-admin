include:
  - compose.yml

services:
  web:
    ports:
      - "5173:80"

  codex:
    image: ghcr.io/meowpow-png/mipe-runtime-codex-web:latest
    environment:
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}
    stdin_open: true
    tty: true
    volumes:
      - codex-home:/home/dev/web/.codex
      - .:/workspace:Z

volumes:
  codex-home:
