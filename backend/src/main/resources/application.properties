server.port=8081
spring.application.name=wifi-admin-api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.server.port=8082
management.endpoints.web.exposure.include=health,shutdown,sync,logging,payloadlogging
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=unrestricted

cxf.log-faults=true

platform.soap-endpoint=${SOAP_ENDPOINT}
platform.cpe-id-format=CPE_%03d
platform.cpe-id-count=12
platform.sync-on-startup=true
platform.sync-schedule=00:00
platform.connection-timeout=5s
platform.receive-timeout=10s
platform.retry.max-attempts=3
platform.retry.delay=3s
platform.retry.max-delay=10s
platform.retry.delay-multiplier=2.0

security.aes-key=${AES_KEY}
security.jwt-secret=${JWT_SECRET}
security.jwt-expiration=PT1H
security.allowed-origins=http://localhost:5173
security.public-endpoints=/auth/login
