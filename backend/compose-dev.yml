name: wifi-admin

services:
  api:
    build: .
    image: hr-telekom/wifi-admin-api:1.0.0
    container_name: api
    depends_on:
      postgres:
        condition: service_healthy
      platform-mock:
        condition: service_started
    environment:
      AES_KEY: ${AES_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SOAP_ENDPOINT: http://platform-mock:3000/platform
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Zagreb
    ports:
      - "8081:8081"
      - "8082:8082"

  api-codex:
    image: hr-telekom/wifi-admin-codex:21-jdk
    container_name: api-codex
    build:
      context: ./docker/codex
    working_dir: /workspace
    security_opt:
      - seccomp=unconfined
    environment:
      LOCAL_UID: ${LOCAL_UID:-0}
      LOCAL_GID: ${LOCAL_GID:-0}
      CODEX_WARMUP: ${CODEX_WARMUP:-false}
      HOME: /home/codex
    stdin_open: true
    tty: true
    volumes:
      - codex-home:/home/codex
      - ./.codex:/workspace/shared:Z
      - ./docker/codex/AGENTS.md:/workspace/AGENTS.md:ro,Z
      - ./docker/codex/tasks:/workspace/tasks:ro,Z
      - ./docs:/workspace/docs:Z
      - ./mockoon:/workspace/mockoon:ro,Z
      - ./openapi:/workspace/openapi:ro,Z
      - ./README.md:/workspace/README.md:Z
      - ./src:/workspace/src:Z
      - ./build-logic:/workspace/build-logic:Z
      - ./build.gradle.kts:/workspace/build.gradle.kts:Z
      - ./settings.gradle:/workspace/settings.gradle:Z
      - ./gradle.properties:/workspace/gradle.properties:ro,Z
      - ./gradlew:/workspace/gradlew:ro,Z
      - ./gradle:/workspace/gradle:Z

volumes:
  codex-home:
